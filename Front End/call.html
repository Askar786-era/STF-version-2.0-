<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Voice Call - Stranger to Friends</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items:center;
            margin: 0;
            color: white;
        }
        .call-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 350px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: #ff4b2b;
        }
        h2 { margin: 10px 0; }
        .status { font-size: 18px; opacity: 0.8; margin-bottom: 30px; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.1); }
        .hangup { background: #ff3b30; color: white; }
        .mute { background: rgba(255,255,255,0.2); color: white; }
    </style>
</head>
<body>

    <div class="call-container">
        <div class="avatar">👤</div>
        <h2 id="donorName">Donor</h2>
        <div class="status" id="status">Calling...</div>

        <div class="controls">
            <button class="btn mute">🎙️</button>
            <button class="btn hangup" onclick="hangUp()">📞</button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const isAnswering = urlParams.get('answer') === 'true';
        
        let targetPhone = urlParams.get('phone');
        let targetName = urlParams.get('name');
        let callType = urlParams.get('type') || 'donor';
        
        if (!isAnswering) {
            document.getElementById('donorName').innerText = targetName || 'User';
        } else {
            document.getElementById('donorName').innerText = 'Incoming Call';
            document.getElementById('status').innerText = 'Connecting...';
        }

        let localStream;
        let peerConnection;
        let peerSocketId;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function startCall() {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            peerConnection = new RTCPeerConnection(config);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteAudio').srcObject = event.streams[0];
                document.getElementById('status').innerText = 'In Call';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('iceCandidate', { to: peerSocketId, candidate: event.candidate });
                }
            };

            if (!isAnswering) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                const donorInfo = JSON.parse(localStorage.getItem('donorInfo'));
                const callerName = donorInfo ? donorInfo.fullName : 'Stranger';

                socket.emit('callUser', {
                    phone: targetPhone,
                    signalData: offer,
                    callerName: callerName,
                    type: callType
                });
            } else {
                const pending = JSON.parse(localStorage.getItem('pendingCall'));
                if (pending) {
                    peerSocketId = pending.callerSocket;
                    document.getElementById('donorName').innerText = pending.from || 'User';
                    document.getElementById('status').innerText = 'Accepting...';
                    
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(pending.signal));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);

                    socket.emit('answerCall', { signal: answer, to: peerSocketId });
                    localStorage.removeItem('pendingCall');
                    document.getElementById('status').innerText = 'Connected';
                } else {
                    document.getElementById('status').innerText = 'Call error (No pending call)';
                }
            }
        }

        socket.on('callAccepted', async (data) => {
            peerSocketId = data.donorSocket; 
            document.getElementById('status').innerText = 'Connected';
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
        });

        socket.on('callError', (data) => {
            document.getElementById('status').innerText = data.message;
            document.getElementById('status').style.color = 'yellow';
        });

        socket.on('iceCandidate', (candidate) => {
            if (peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        });

        socket.on('callEnded', () => {
            document.getElementById('status').innerText = 'Call Ended';
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            setTimeout(() => {
                window.close();
            }, 1500);
        });

        function hangUp() {
            socket.emit('endCall');
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            window.close();
        }

        startCall().catch(err => {
            console.error('Error starting call:', err);
            document.getElementById('status').innerText = 'Mic access denied';
        });
    </script>
</body>
</html>
